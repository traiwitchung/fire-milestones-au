<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Networth" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
  <title>Family Networth</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <!-- Pinned to Babel 7: its react preset defaults to the classic React.createElement
       runtime. Unpinned "latest" now serves Babel 8, whose react preset defaults to the
       automatic runtime and injects `import {jsx} from "react/jsx-runtime"` — illegal in a
       classic in-browser script (React here is a UMD global), which kills the whole app. -->
  <script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b1120;
      overflow-y: scroll;
      overflow-x: hidden;
    }
    html { -webkit-text-size-adjust: 100%; }
    /* Prevent iOS Safari from auto-zooming when focusing an input */
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
      input[type="number"], input[type="text"] {
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
      }
    }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: rgba(255,255,255,0.08); border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
      background: #d4a052; border-radius: 50%; cursor: pointer;
      border: 2px solid rgba(0,0,0,0.3);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; background: #d4a052; border-radius: 50%;
      cursor: pointer; border: 2px solid rgba(0,0,0,0.3);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(212,160,82,0.3); border-radius: 4px; }
    ::selection { background: rgba(212,160,82,0.3); }
    .ms-card { transition: border-color 0.2s, transform 0.2s, background 0.2s; }
    .ms-card:hover { border-color: rgba(255,255,255,0.14) !important; transform: translateY(-2px); }
    .ms-stat-card { transition: border-color 0.2s, background 0.2s; }
    .ms-stat-card:hover { border-color: rgba(255,255,255,0.12) !important; background: rgba(255,255,255,0.05) !important; }
    .ms-export-btn { transition: all 0.15s; }
    .ms-export-btn:hover { background: rgba(212, 160, 82, 0.2) !important; border-color: rgba(212, 160, 82, 0.5) !important; }
    /* Budget / Net worth / Home loan */
    input::placeholder { color: #4a5568; }
    input[type="date"] { color-scheme: dark; }
    select option { background: #141c2c; color: #e8eff8; }
    .mn-stat-card { transition: border-color 0.2s, background 0.2s; }
    .mn-stat-card:hover { border-color: rgba(255,255,255,0.12) !important; background: rgba(255,255,255,0.05) !important; }
    .mn-btn { transition: all 0.15s; }
    .mn-btn:hover { background: rgba(212, 160, 82, 0.2) !important; border-color: rgba(212, 160, 82, 0.5) !important; }
    .mn-x:hover { color: #cf6e6e !important; border-color: rgba(207,110,110,0.4) !important; }
    .mn-in:focus { border-color: rgba(212,160,82,0.45) !important; background: rgba(212,160,82,0.06) !important; }
    /* App shell */
    .app-tab { transition: color 0.15s, background 0.15s, border-color 0.15s; }
    .app-tab:hover { color: #e8c88a !important; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #5a6b7d; font: 13px 'DM Sans', system-ui, sans-serif; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div id="root"><div id="boot">Loading…</div></div>
  <input id="pwa-restore-file" type="file" accept="application/json" style="display:none" onchange="pwaImport(event)" />

  <!-- Tabs, in order. Each file is wrapped in its own scope and registers its page on window. -->
  <script type="text/babel" src="./fire.jsx"></script>
  <script type="text/babel" src="./money.jsx"></script>
  <script type="text/babel" src="./loan.jsx"></script>
  <script type="text/babel" src="./overview.jsx"></script>
  <script type="text/babel">
    // ─── App shell: header, tabs (bottom bar on phones), hash routing ───
    const { useState, useEffect } = React;
    const { T, useIsMobile } = window.UI;

    const ICONS = {
      overview: "M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10",
      budget: "M12 3a9 9 0 1 0 9 9h-9zM14 3.2V10h6.8A9 9 0 0 0 14 3.2z",
      networth: "M3 3v18h18M7 15l4-4 3 3 6-7",
      loan: "M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18",
      fire: "M12 3c.8 3.6 5 5.2 5 10a5 5 0 0 1-10 0c0-2.4 1.3-3.9 2.4-5 .4 1.8 1.4 2.8 2.6 2.8 0-2.9-1-4.8 0-7.8z",
    };
    const TABS = [
      { id: "overview", label: "Overview", title: null },
      { id: "budget", label: "Budget", title: "Budget", desc: "Where each month's take-home pay goes — enter amounts weekly, monthly or yearly; everything's converted to per month." },
      { id: "networth", label: "Net worth", title: "Net worth", desc: "Your balances from monthly check-ins, the emergency-fund ladder, and the numbers that feed FIRE." },
      { id: "loan", label: "Home loan", title: "Home loan", desc: "Day-by-day loan simulation — interest charged daily on the loan minus your offset, like a real Australian loan." },
      { id: "fire", label: "FIRE", title: "FIRE milestones", desc: "When you reach Coast, Barista and Full FIRE — AU super rules, the bridge to preservation age, and your mortgage included." },
    ];
    const PAGES = {
      overview: (p) => <window.OverviewPage {...p} />,
      budget: (p) => <window.MoneyPage section="budget" {...p} />,
      networth: (p) => <window.MoneyPage section="networth" autoCheckIn={p.intent === "checkin"} {...p} />,
      loan: (p) => <window.LoanPage {...p} />,
      fire: (p) => <window.FirePage {...p} />,
    };

    // "#networth/checkin" → { id: "networth", intent: "checkin" }
    const parseHash = () => {
      const [id, intent] = location.hash.replace(/^#\/?/, "").split("/");
      return { id: PAGES[id] ? id : "overview", intent: intent || null };
    };
    const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; };
    const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const todayLabel = () => { const d = new Date(); return `${d.getFullYear()}${MONTHS[d.getMonth()]}${String(d.getDate()).padStart(2, "0")}`; };

    const TabIcon = ({ id, size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
        <path d={ICONS[id]} />
      </svg>
    );
    const HeaderBtn = ({ onClick, children, title }) => (
      <button onClick={onClick} title={title} style={{
        padding: "6px 11px", borderRadius: 999, cursor: "pointer", fontSize: 11, fontWeight: 600,
        background: "transparent", border: "1px solid rgba(212,160,82,0.35)", color: T.accent,
        fontFamily: "'DM Sans', sans-serif", whiteSpace: "nowrap",
      }}>{children}</button>
    );

    function App() {
      const isMobile = useIsMobile();
      const [route, setRoute] = useState(parseHash);
      useEffect(() => {
        const onHash = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);
      // An intent (e.g. open the check-in form) is one-shot — drop it from the URL once used.
      useEffect(() => { if (route.intent) history.replaceState(null, "", `#${route.id}`); }, [route]);
      const go = (id, intent) => {
        const h = intent ? `#${id}/${intent}` : `#${id}`;
        if (location.hash === h) { setRoute(parseHash()); window.scrollTo(0, 0); } else location.hash = h;
      };
      const tab = TABS.find(t => t.id === route.id);
      const pad = isMobile ? 16 : 32;

      return (
        <div style={{
          minHeight: "100vh", background: "linear-gradient(165deg, #0b1120 0%, #101624 40%, #141e30 100%)",
          color: "#c8d5e2", fontFamily: "'DM Sans', sans-serif", position: "relative", overflowX: "hidden",
          paddingBottom: isMobile ? "calc(64px + env(safe-area-inset-bottom, 0px))" : 0,
        }}>
          <div style={{
            position: "fixed", inset: 0, pointerEvents: "none", zIndex: 0,
            background: "radial-gradient(ellipse at 20% 0%, rgba(212,160,82,0.04) 0%, transparent 60%), radial-gradient(ellipse at 80% 100%, rgba(76,140,120,0.03) 0%, transparent 50%)",
          }} />

          {/* Header (sticky on desktop, with the tabs) */}
          <header style={{
            position: isMobile ? "relative" : "sticky", top: 0, zIndex: 20,
            background: isMobile ? "transparent" : "rgba(11,17,32,0.82)",
            backdropFilter: isMobile ? "none" : "blur(14px)", WebkitBackdropFilter: isMobile ? "none" : "blur(14px)",
            borderBottom: isMobile ? "none" : "1px solid rgba(255,255,255,0.05)",
            paddingTop: "env(safe-area-inset-top, 0px)",
          }}>
            <div style={{ maxWidth: 1400, margin: "0 auto", padding: `${isMobile ? 16 : 14}px ${pad}px ${isMobile ? 0 : 14}px`, display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
              <a href="#overview" style={{ textDecoration: "none", display: "flex", alignItems: "baseline", gap: 10 }}>
                <span style={{
                  fontSize: isMobile ? 22 : 24, fontWeight: 800, letterSpacing: "-0.02em", fontFamily: "'Playfair Display', serif",
                  background: `linear-gradient(135deg, ${T.accent}, ${T.accentLight})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
                }}>Family Networth</span>
              </a>
              {!isMobile && (
                <nav style={{ display: "flex", gap: 4 }}>
                  {TABS.map(t => {
                    const on = t.id === route.id;
                    return (
                      <a key={t.id} href={`#${t.id}`} className="app-tab" style={{
                        display: "inline-flex", alignItems: "center", gap: 7, padding: "7px 13px", borderRadius: 999,
                        fontSize: 13, fontWeight: 600, textDecoration: "none",
                        background: on ? T.accentBg : "transparent", border: `1px solid ${on ? T.accentDim : "transparent"}`,
                        color: on ? T.accent : T.textMid,
                      }}><TabIcon id={t.id} size={15} />{t.label}</a>
                    );
                  })}
                </nav>
              )}
              <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                <HeaderBtn onClick={() => window.pwaExport()} title="Download all your data as a JSON backup">⤓ Backup</HeaderBtn>
                <HeaderBtn onClick={() => document.getElementById("pwa-restore-file").click()} title="Restore from a JSON backup">⤒ Restore</HeaderBtn>
              </div>
            </div>
          </header>

          {/* Page title */}
          <div style={{ position: "relative", zIndex: 1, maxWidth: 1400, margin: "0 auto", padding: `${isMobile ? 14 : 22}px ${pad}px 0` }}>
            {tab.title ? (
              <>
                <h1 style={{ fontSize: isMobile ? 20 : 22, fontWeight: 700, color: T.text, margin: 0, letterSpacing: "-0.01em" }}>{tab.title}</h1>
                <p style={{ fontSize: 13, color: "#4a5b6d", margin: "4px 0 0", maxWidth: 760, lineHeight: 1.5 }}>{tab.desc}</p>
              </>
            ) : (
              <>
                <h1 style={{ fontSize: isMobile ? 20 : 22, fontWeight: 700, color: T.text, margin: 0 }}>{greeting()}</h1>
                <p style={{ fontSize: 13, color: "#4a5b6d", margin: "4px 0 0" }}>{todayLabel()} · here's where everything stands.</p>
              </>
            )}
          </div>

          <main style={{ position: "relative", zIndex: 1 }}>
            {PAGES[route.id]({ key: route.id + (route.intent || ""), go, intent: route.intent })}
          </main>

          <footer style={{ position: "relative", zIndex: 1, textAlign: "center", fontSize: 11, color: T.textDark, padding: "0 16px 28px" }}>
            by Traiwit Chung &amp; Claude Code
          </footer>

          {/* Bottom tab bar (phones) */}
          {isMobile && (
            <nav style={{
              position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 30,
              display: "grid", gridTemplateColumns: `repeat(${TABS.length}, 1fr)`,
              background: "rgba(11,17,32,0.94)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)",
              borderTop: "1px solid rgba(255,255,255,0.07)",
              paddingBottom: "env(safe-area-inset-bottom, 0px)",
            }}>
              {TABS.map(t => {
                const on = t.id === route.id;
                return (
                  <a key={t.id} href={`#${t.id}`} style={{
                    display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "9px 0 8px",
                    textDecoration: "none", fontSize: 10, fontWeight: 600, letterSpacing: "0.02em",
                    color: on ? T.accent : T.textDim,
                  }}><TabIcon id={t.id} size={21} />{t.label}</a>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <!-- ── Backup / restore + service-worker registration ── -->
  <script>
  (function(){
    window.pwaExport = function(){
      try { localStorage.setItem('fire-meta', JSON.stringify(Object.assign(JSON.parse(localStorage.getItem('fire-meta') || '{}'), { lastBackup: new Date().toISOString() }))); } catch (_) {}
      var dump = { _meta: { app: 'fire-au', exportedAt: new Date().toISOString() } };
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i), v = localStorage.getItem(k);
        try { v = JSON.parse(v); } catch (_) {}
        dump[k] = v;
      }
      var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'networth-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    };
    window.pwaImport = function(e){
      var f = e.target.files[0]; if (!f) return;
      e.target.value = ''; // let the same file be picked again
      if (!confirm('Restore will overwrite your current data with the backup. Continue?')) return;
      var r = new FileReader();
      r.onload = function(){
        try {
          var parsed = JSON.parse(r.result);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('shape');
          Object.keys(parsed).forEach(function(k){
            if (k.charAt(0) === '_') return;
            var v = parsed[k];
            localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
          });
          location.reload();
        } catch (err) { alert('That file does not look like a valid backup.'); }
      };
      r.readAsText(f);
    };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').then(function(reg){
          // Actively check for a newer SW on every load so deploys propagate.
          if (reg && reg.update) { try { reg.update(); } catch(_){} }
        }).catch(function(err){
          console.warn('SW registration failed:', err);
        });
      });
    }
  })();
  </script>
</body>
</html>
